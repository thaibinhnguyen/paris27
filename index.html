<style>
/* Layout: parchment journal, one column; sticky top bar, fixed bottom tab bar; aged-paper cards (24px), pill controls. Terracotta by day, Nuit when the phone is in dark mode. */
:root{
  --parchment:#FEF9EF; --paper:#F5EEE1; --paper-2:#EDE4D3; --taupe:#D1C9BF; --ink:#2A2B2F; --charcoal:#333333; --graphite:#515151; --ash:#808988;
  --seal:#B05A36; --seal-ring:rgba(176,90,54,.2); --seal-wash:rgba(176,90,54,.09);
  --serif:"Instrument Serif","Financier Display","Tiempos Headline",Georgia,serif;
  --sans:"Inter","Ftbase","Söhne",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Fragment Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
/* Nuit: warm dark variant, follows the phone's appearance setting */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --parchment:#1D1B18; --paper:#292622; --paper-2:#34302B; --taupe:#3E3933; --ink:#F3ECDF; --charcoal:#E2DACB; --graphite:#ABA293; --ash:#7F786D;
  --seal:#D38C5F; --seal-ring:rgba(211,140,95,.3); --seal-wash:rgba(211,140,95,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --parchment:#1D1B18; --paper:#292622; --paper-2:#34302B; --taupe:#3E3933; --ink:#F3ECDF; --charcoal:#E2DACB; --graphite:#ABA293; --ash:#7F786D;
  --seal:#D38C5F; --seal-ring:rgba(211,140,95,.3); --seal-wash:rgba(211,140,95,.12); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--parchment);color:var(--charcoal);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.023em;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding-inline:20px;padding-block:0 112px}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px var(--seal-ring)}
.num{font-variant-numeric:tabular-nums}
em{font-style:italic;font-weight:400}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--parchment);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--taupe)}
.brand{font-family:var(--serif);font-size:26px;line-height:1;color:var(--ink);letter-spacing:0}
.brand em{color:var(--seal)}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:uppercase;color:var(--graphite);margin-top:6px}
.lang{display:flex;background:var(--paper);border-radius:9999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:9999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--graphite)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--parchment)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--parchment);border-top:1px solid var(--taupe);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;padding:10px 2px 12px;font-size:11px;font-weight:600;color:var(--graphite);display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.tabs button[aria-current="page"]{color:var(--seal)}
.tabs button[aria-current="page"] span{border-bottom:1.5px solid var(--seal)}

/* type */
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.02;margin:0;color:var(--ink);letter-spacing:0;text-wrap:balance}
h1 em,h2 em{color:var(--ink)}
h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:0;margin:0;color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:0;color:var(--seal)}
.eyebrow.mute{color:var(--graphite)}
.meta{margin:0;font-size:14px;color:var(--graphite);display:flex;flex-wrap:wrap;column-gap:10px;row-gap:4px}
.meta .sep{color:var(--seal)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;padding-top:32px}
.section-h{display:flex;flex-direction:column;gap:8px}

/* day header */
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:28px}
.dayhead .stack{gap:10px;min-width:0}
.nav{display:flex;gap:6px;flex-shrink:0}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--taupe);background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--paper)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}

/* status */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--taupe);background:transparent;border-radius:40px;padding:11px 4px;font-weight:600;font-size:15px;color:var(--ink)}
.seg button[data-v="done"][aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:var(--parchment)}
.seg button[data-v="partial"][aria-pressed="true"]{border-color:var(--seal);color:var(--seal);background:var(--seal-wash)}
.seg button[data-v="missed"][aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--parchment)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ash);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0}
.st.done{color:var(--seal)} .st.done::before{background:var(--seal)}
.st.partial{color:var(--seal)}
.st.missed{color:var(--ink)} .st.missed::before{background:var(--ink);border-radius:1px;height:2px;border:0;width:9px}

/* cards & sets */
.card{background:var(--paper);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lift-h{display:flex;flex-direction:column;gap:6px}
.lift-h b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;color:var(--ink);letter-spacing:0}
.lift-h span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0;color:var(--graphite)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:8px;align-items:center}
.set .n{font-family:var(--mono);font-size:11px;color:var(--graphite);text-align:center}
.field{display:flex;align-items:center;background:var(--parchment);border:1px solid var(--ash);border-radius:9999px;padding:0 14px;min-width:0}
.field input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:600;padding:9px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.field input::placeholder{color:var(--ash);font-weight:400}
.field input:focus{outline:none;box-shadow:none}
.field:focus-within{box-shadow:0 0 0 3px var(--seal-ring);border-color:var(--seal)}
.field em{font-style:normal;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--graphite);white-space:nowrap}
.tick{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--taupe);background:transparent;display:grid;place-items:center}
.tick svg{width:18px;height:18px;stroke:var(--ash);fill:none;stroke-width:1.8}
.tick[aria-pressed="true"]{background:var(--seal);border-color:var(--seal)}
.tick[aria-pressed="true"] svg{stroke:var(--parchment)}
.row2{display:flex;gap:18px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--seal);font-weight:600;font-size:14px;padding:4px 0}
.linkbtn.mute{color:var(--graphite);font-weight:400}
.textitem{font-size:15px;color:var(--charcoal);margin:0;white-space:pre-wrap}
.textitem.dim{color:var(--graphite);font-size:14px}
.brief{border-left:1.5px solid var(--seal);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2{align-items:start}
.field{min-height:48px}
.readout{display:flex;align-items:center;min-height:48px;padding:0 18px;border-radius:9999px;background:var(--paper-2);font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink);letter-spacing:0;font-weight:400}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--taupe);background:transparent;border-radius:9999px;height:40px;font-weight:600;font-size:15px;color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:var(--parchment)}
.scale10{grid-template-columns:repeat(10,1fr);gap:4px}
.scale10 button{height:36px;font-size:14px}
.lbl small{font-weight:400;color:var(--ash);margin-left:4px}
.grid2 label,.lbl{font-size:13px;font-weight:600;color:var(--graphite);display:flex;flex-direction:column;gap:6px;min-width:0}
textarea{width:100%;min-height:96px;border:1px solid var(--ash);border-radius:20px;background:var(--parchment);color:var(--ink);font:inherit;font-size:16px;padding:12px 16px;resize:vertical}
textarea::placeholder{color:var(--ash)}
.metric{font-family:var(--serif);font-size:44px;line-height:1;color:var(--ink);letter-spacing:0}
.metric small{font-family:var(--sans);font-size:15px;color:var(--graphite);letter-spacing:-.023em;margin-left:4px}
.save{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--graphite);min-height:12px}

/* lists */
.list{border-top:1px solid var(--taupe)}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border:0;border-bottom:1px solid var(--taupe);background:none;width:100%;text-align:left}
.li .d{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--graphite);line-height:1}
.li .d b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--ink);margin-top:4px}
.li .s{min-width:0;font-size:16px;color:var(--ink);line-height:1.3}
.li .s small{display:block;color:var(--graphite);font-size:13px;margin-top:2px}
.li.today{background:var(--paper);border-radius:16px;border-bottom-color:transparent;padding-inline:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:4px 0 4px 16px;border-left:1px solid var(--taupe);min-width:0}
.stat:first-child{padding-left:0;border-left:0}
.stat .metric{font-size:38px}
.stat>small{display:block;font-size:13px;color:var(--graphite);margin-top:6px}
.phase{display:flex;flex-direction:column;gap:10px;padding-top:32px}
.wk{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--taupe);background:none;width:100%;text-align:left}
.wk .n{font-family:var(--serif);font-size:28px;color:var(--ink);line-height:1}
.wk .s{min-width:0;color:var(--ink);font-size:15px;line-height:1.3}
.wk .s small{display:block;color:var(--graphite);font-size:13px}
.wk.cur{background:var(--paper);border-radius:16px;border-bottom-color:transparent;padding-inline:12px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--taupe)}
.dots i.ok{background:var(--seal);border-color:var(--seal)} .dots i.warn{border-color:var(--seal)} .dots i.bad{background:var(--ink);border-color:var(--ink)}
.hero{padding-top:32px;display:flex;flex-direction:column;gap:12px}
.hero .metric{font-size:76px;line-height:.92}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1;color:var(--ink);letter-spacing:0;margin-top:-4px}

/* charts & tables */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--graphite);font-family:var(--sans);font-size:17px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--graphite);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0;color:var(--graphite);font-weight:400;text-align:left;padding:0 8px 10px;border-bottom:1px solid var(--taupe)}
td{padding:12px 8px;border-bottom:1px solid var(--taupe);color:var(--ink);font-variant-numeric:tabular-nums;vertical-align:top}
td small{color:var(--graphite);white-space:nowrap}
td.r,th.r{text-align:right}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
.tablewrap{overflow-x:auto;background:var(--paper);border-radius:24px;padding:20px}
.tablewrap tr:last-child td{border-bottom:0}
.gap{color:var(--seal);font-weight:600}
.ok-txt{color:var(--seal)}
.banner{background:var(--paper);color:var(--ink);border-radius:24px;padding:20px;font-size:15px}
.btn{border:0;background:var(--seal);color:var(--parchment);font-weight:600;border-radius:40px;padding:12px 24px;font-size:16px}
.empty{color:var(--graphite);font-size:15px;margin:0}
.tally{display:flex;flex-wrap:wrap;gap:6px 18px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .22s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
@media (max-width:380px){h1{font-size:34px}.hero .metric{font-size:62px}.stat .metric{font-size:32px}}
/* standalone app shell: edge to edge under the status bar and home indicator */
[hidden]{display:none!important}
html{background:var(--parchment);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;overscroll-behavior-y:none}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
input,textarea{font-size:16px}
#login{max-width:420px}
#login .row2{align-items:center;margin-top:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer;line-height:1.5}
.acct{align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>

// ---------- time helpers ----------
const DAY=864e5;
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
// iPhone number pad has no ":", so time fields take digits and the colons are inserted from the right: 4530 -> 45:30, 10512 -> 1:05:12
function maskTime(v){const d=String(v).replace(/\D/g,"").slice(0,6);if(d.length<3)return d;const g=[];for(let i=d.length;i>0;i-=2)g.unshift(d.slice(Math.max(0,i-2),i));return g.join(":")}
function secs(str){if(str==null)return null;const p=String(str).trim().split(":").map(Number);if(!p.length||p.some(isNaN)||String(str).trim()==="")return null;return p.reduce((a,b)=>a*60+b,0)}
function fmt(s){if(s==null||!isFinite(s))return"–";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function fmtNum(n,d=1){return n==null?"–":(Math.round(n*10**d)/10**d).toLocaleString(lang==="fr"?"fr-FR":"en-GB")}
function epley(kg,reps){return kg*(1+reps/30)}

const ciDirty=new Set(), ciTimers={}, ciWriting={};
function ymd(dt){return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`}
function ciEdit(k){if(!S.checkins[k])S.checkins[k]={};return S.checkins[k]}
function ciSave(k){ciDirty.add(k);setSave("saving");clearTimeout(ciTimers[k]);ciTimers[k]=setTimeout(()=>ciFlush(k),700)}
async function ciFlush(k){
  if(!db)return setSave("unsaved");
  if(ciWriting[k]){ciTimers[k]=setTimeout(()=>ciFlush(k),300);return}
  ciWriting[k]=true;const body=JSON.parse(JSON.stringify(S.checkins[k]));body.updatedAt=new Date().toISOString();
  try{const r=await db.collection("checkins").doc(k).set(body);ciDirty.delete(k);if(!dirty.size&&!ciDirty.size)setSave(r&&r.synced===false?"offline":"saved")}

}
function scale(attr,key,n,val){return`<div class="scale${n>5?" scale10":""}" role="group" aria-label="${key}">${Array.from({length:n},(_,i)=>i+1).map(v=>`<button type="button" ${attr}="${key}" data-v="${v}" aria-pressed="${val===v}">${v}</button>`).join("")}</div>`}

function dateOf(w,d){return new Date(parseISO(S.meta.start).getTime()+((w-1)*7+d)*DAY)}
function idOf(w,d){return "w"+String(w).padStart(2,"0")+"-d"+d}
function todayIdx(){if(!S.meta)return{w:1,d:0};const n=Math.round((midnight(new Date())-parseISO(S.meta.start))/DAY);const c=Math.max(0,Math.min(27*7-1,n));return{w:Math.floor(c/7)+1,d:c%7,before:n<0,raw:n}}
function weekData(w){return S.weeks["w"+String(w).padStart(2,"0")]}
function dayData(w,d){const wk=weekData(w);return wk&&wk.days[d]}
function expand(item){const out=[];for(const b of item.blocks)for(let i=0;i<b.sets;i++)out.push({kg:b.kg,reps:parseInt(b.reps,10),target:b.reps,hand:b.hand});return out}
function logOf(id){return S.logs[id]||{}}
function editable(id){if(!S.logs[id])S.logs[id]={status:null,notes:"",lifts:{}};const l=S.logs[id];if(!l.lifts)l.lifts={};return l}
function runSessionish(day){return day.km>0||/course|sortie|z2|run|fractionn|tempo|test/i.test(day.session)}
function stationish(day){return /station|simulation|sled|affûtage|jour j/i.test(day.session)}
function isTest(day){return /^TEST/i.test(day.session)}
function statusChip(st,past){if(st)return`<span class="st ${st}">${t(st)}</span>`;return past?`<span class="st">${t("notLogged")}</span>`:""}
function serif(s){s=esc(s);let m=s.match(/^(.+?)\s+→\s+(.+)$/);if(m)return`${m[1]} → <em>${m[2]}</em>`;m=s.match(/^(.+?)\s+[–—]\s+(.+)$/);if(m)return`${m[1]} <em>${m[2]}</em>`;m=s.match(/^(.+?)\s+(\(.+\))$/);if(m)return`${m[1]} <em>${m[2]}</em>`;m=s.match(/^(.+?)\s+(\+\s.+)$/);if(m)return`${m[1]} <em>${m[2]}</em>`;return s}
function meta(parts){return`<p class="meta num">${parts.filter(Boolean).map(esc).join('<span class="sep" aria-hidden="true">·</span>')}</p>`}
function phaseOf(w){return S.meta.phases.find(p=>w>=p.from&&w<=p.to)}
function weekKm(w){let p=0,a=0;const wk=weekData(w);if(!wk)return{p,a};wk.days.forEach((d,i)=>{p+=d.km||0;const r=logOf(idOf(w,i)).run;if(r&&r.km)a+=Number(r.km)||0});return{p,a}}

// ---------- saving ----------
function scheduleSave(id){dirty.add(id);setSave("saving");clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700)}
async function flush(id){
  if(!db)return setSave("unsaved");
  if(writing[id]){timers[id]=setTimeout(()=>flush(id),300);return}
  writing[id]=true;
  const body=JSON.parse(JSON.stringify(S.logs[id]));body.updatedAt=new Date().toISOString();delete body.source;
  try{const r=await db.collection("logs").doc(id).set(body);dirty.delete(id);if(!dirty.size&&!ciDirty.size)setSave(r&&r.synced===false?"offline":"saved")}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*700));try{await db.collection("logs").doc(id).set(body);dirty.delete(id);if(!dirty.size)setSave("saved")}catch(e2){setSave("unsaved")}}else setSave("unsaved")}
  finally{writing[id]=false}
}

function vDay(){
  const {w,d}=S.sel, day=dayData(w,d), id=idOf(w,d), log=logOf(id), wk=weekData(w);
  if(!day){V.innerHTML=`<p class="empty">${t("emptyPlan")}</p>`;return}
  const date=dateOf(w,d), ph=phaseOf(w);
  const ti=todayIdx(); const isToday=ti.w===w&&ti.d===d&&!ti.before;
  let h=`<div class="dayhead"><div class="stack"><span class="eyebrow num">${isToday?t("today")+" · ":""}${t("dl")[d]} ${date.toLocaleDateString(lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"long"})}</span>

      <label class="lbl">${t("waist")}<span class="field"><input id="ciwa-${dk}" inputmode="decimal" data-ci="waist" value="${ci.waist??""}" placeholder="–"><em>cm</em></span></label></div>
      ${["sleepQ","fatigue","soreness"].map(k=>`<div class="lbl"><span>${t(k)} <small>${t(k+"Hint")}</small></span>${scale("data-ci-scale",k,5,ci[k])}</div>`).join("")}</div></div>`;
  }
  h+=`<div class="section"><div class="seg" role="group" aria-label="Status">${["done","partial","missed"].map(v=>`<button type="button" data-status="${v}" data-v="${v}" aria-pressed="${log.status===v}">${t(v)}</button>`).join("")}</div>${day.session!=="Repos"?`<div class="lbl"><span>${t("rpe")} <small>${t("rpeHint")}</small></span>${scale("data-rpe","rpe",10,log.rpe)}</div>`:""}<div class="save" id="save" aria-live="polite">${saveState?t(saveState):""}</div></div>`;
  h+=`<div class="stack">`;

  day.items.forEach((it,i)=>{
    if(it.t!=="lift"){textBuf.push(it.text);return}
    flushText();
    const plan=expand(it), act=(log.lifts||{})[i];
    const rows=act||plan.map(p=>({kg:p.kg,reps:p.reps,done:false}));
    const planTxt=it.blocks.map(b=>`${fmtNum(b.kg)} ${b.hand?t("perHand"):"kg"} × ${b.reps} × ${b.sets}`).join(" + ");

      h+=`<div class="set"><span class="n num">${s+1}</span>
       <label class="field"><input id="kg-${id}-${i}-${s}" inputmode="decimal" data-lift="${i}" data-s="${s}" data-f="kg" value="${r.kg??""}" aria-label="${t("set")} ${s+1} ${unit}"><em>${unit}</em></label>

    for(let w=p.from;w<=p.to;w++){const wk=weekData(w);if(!wk)continue;const km=weekKm(w);
      const dots=wk.days.map((d,i)=>{const s=logOf(idOf(w,i)).status;return`<i class="${s==="done"?"ok":s==="partial"?"warn":s==="missed"?"bad":""}"></i>`}).join("");
      h+=`<button type="button" class="wk${w===ti.w&&!ti.before?" cur":""}" data-week="${w}"><span class="n num">${w}</span><span class="s">${esc(tr(wk.type,WT))}<small class="num">${dateOf(w,0).toLocaleDateString(lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short"})} · ${fmtNum(km.a)}/${fmtNum(km.p)} km</small></span><span class="dots">${dots}</span></button>`}
    h+=`</div></div>`}
  V.innerHTML=h;
}

function vProgress(){
  const ti=todayIdx(); let h="";
  // 5 km tests
  const tests=[];for(let w=1;w<=27;w++){const wk=weekData(w);if(!wk)continue;wk.days.forEach((d,i)=>{if(isTest(d)){const l=logOf(idOf(w,i));const s=secs(l.test5k)||(l.run&&Number(l.run.km)===5?secs(l.run.time):null);tests.push({w,i,s})}})}
  const [tLo,tHi]=S.meta.target5k.map(secs);
  h+=`<div class="section"><h2>${serif(t("tests"))}</h2><div class="tablewrap"><table><thead><tr><th>${t("wk")}</th><th>${t("result")}</th><th class="r">${t("pace")}</th><th class="r">${t("target")}</th></tr></thead><tbody>`;
  tests.forEach(x=>{const gap=x.s?x.s-tHi:null;h+=`<tr><td>${x.w} · ${dateOf(x.w,x.i).toLocaleDateString(lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short"})}</td><td><b>${x.s?fmt(x.s):"–"}</b></td><td class="r">${x.s?fmt(x.s/5)+"/km":"–"}</td><td class="r">${x.s?(gap>0?`<span class="gap">+${fmt(gap)}</span>`:`<span class="ok-txt">${t("done")}</span>`):`<small>${S.meta.target5k.join("–")}</small>`}</td></tr>`});
  h+=`</tbody></table></div></div>`;
  // weekly km chart
  const W=560,H=240,pl=34,pb=30,pt=12,bw=(W-pl-6)/27;const data=[];let max=0;for(let w=1;w<=27;w++){const k=weekKm(w);data.push(k);max=Math.max(max,k.p,k.a)}
  max=Math.ceil(max/10)*10||10;const y=v=>pt+(H-pt-pb)*(1-v/max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("weeklyKm")}">`;
  for(let g=0;g<=max;g+=10)svg+=`${g===0?`<line x1="${pl}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--taupe)" stroke-width="1"/>`:""}<text x="${pl-4}" y="${y(g)+3}" text-anchor="end">${g%20===0?g:""}</text>`;
  data.forEach((k,i)=>{const x=pl+i*bw+2;svg+=`<rect x="${x}" y="${y(k.p)}" width="${bw-4}" height="${y(0)-y(k.p)}" fill="var(--paper-2)" stroke="var(--taupe)" stroke-width="1" rx="2"/>`;
    if(k.a>0)svg+=`<rect x="${x+2}" y="${y(Math.min(k.a,max))}" width="${bw-8}" height="${y(0)-y(Math.min(k.a,max))}" fill="var(--seal)" rx="2"/>`;
    if(i%3===0||i===26)svg+=`<text x="${x+(bw-4)/2}" y="${H-6}" text-anchor="middle" ${i+1===ti.w?'style="font-weight:700;fill:var(--ink)"':""}>${i+1}</text>`});
  svg+=`</svg>`;
  h+=`<div class="section"><h2>${serif(t("weeklyKm"))}</h2><div class="legend"><span><i style="background:var(--paper-2);border:1px solid var(--taupe)"></i>${t("kmPlan")}</span><span><i style="background:var(--seal)"></i>${t("kmDone")}</span></div><div class="card chart">${svg}</div></div>`;
  // strength
  const best={};for(const [id,l] of Object.entries(S.logs)){const m=id.match(/^w(\d+)-d(\d)$/);if(!m)continue;const day=dayData(+m[1],+m[2]);if(!day||!l.lifts)continue;
    for(const [i,sets] of Object.entries(l.lifts)){const it=day.items[+i];if(!it||it.t!=="lift")continue;for(const s of sets){if(!s.done||!s.kg||!s.reps)continue;const e=epley(+s.kg,+s.reps);if(!best[it.name]||e>best[it.name].e)best[it.name]={e,kg:+s.kg,reps:+s.reps}}}}
  h+=`<div class="section"><h2>${serif(t("strength"))}</h2><div class="tablewrap"><table><thead><tr><th></th><th class="r">${t("start")}</th><th class="r">${t("best")}</th><th class="r">Δ</th></tr></thead><tbody>`;
  for(const [n,[kg,r]] of Object.entries(S.meta.baseline)){const b0=epley(kg,r),b=best[n];const d=b?b.e-b0:null;
    h+=`<tr><td>${esc(tr(n,EX))}</td><td class="r">${fmtNum(b0)}</td><td class="r">${b?`<b>${fmtNum(b.e)}</b><br><small>${fmtNum(b.kg)}×${b.reps}</small>`:"–"}</td><td class="r">${d==null?"–":(d>=0?"+":"")+fmtNum(d)}</td></tr>`}
  h+=`</tbody></table></div></div>`;
  // stations
  const rows=[];for(const [id,l] of Object.entries(S.logs)){if(!l.stations)continue;const vals=STATIONS.map(n=>l.stations[n]||"");if(vals.some(Boolean)){const m=id.match(/^w(\d+)-d(\d)$/);rows.push({w:+m[1],d:+m[2],vals})}}
  rows.sort((a,b)=>a.w-b.w||a.d-b.d);
  h+=`<div class="section"><h2>${serif(t("stationTimes"))}</h2>`;
  if(rows.length){h+=`<div class="tablewrap"><table><thead><tr><th>${t("wk")}</th>${STATIONS.map(n=>`<th class="r">${n.split(" ")[0]}</th>`).join("")}</tr></thead><tbody>`+rows.map(r=>`<tr><td>${r.w}·${t("dn")[r.d]}</td>${r.vals.map(v=>`<td class="r">${esc(v)||"–"}</td>`).join("")}</tr>`).join("")+`</tbody></table></div>`}
  else h+=`<p class="empty">${lang==="fr"?"Saisissez vos temps lors des journées stations et des simulations (semaines 22–24).":"Log your times on station days and race simulations (weeks 22–24)."}</p>`;
  h+=`</div>`;
  // recovery
  const cis=Object.entries(S.checkins).filter(([k,v])=>/^\d{4}-\d\d-\d\d$/.test(k)).sort((a,b)=>a[0]<b[0]?-1:1);
  h+=`<div class="section"><h2>${serif(t("recovery"))}</h2>`;
  const wts=cis.filter(([k,v])=>v.weight).map(([k,v])=>({k,v:+v.weight}));
  if(!cis.length)h+=`<p class="empty">${t("noCheckin")}</p>`;
  else{
    if(wts.length){const last=wts[wts.length-1],first=wts[0];const dlt=last.v-first.v;
      h+=`<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><div class="metric num">${fmtNum(last.v)}<small>kg</small></div><small>${t("weight")} · ${esc(last.k.slice(5).split("-").reverse().join("/"))}</small></div><div class="stat"><div class="metric num">${dlt>0?"+":""}${fmtNum(dlt)}<small>kg</small></div><small>${t("start")} ${fmtNum(first.v)} kg</small></div></div>`;
      if(wts.length>1){const W2=560,H2=150,pd=14;let mn=Math.min(...wts.map(x=>x.v))-0.5,mx=Math.max(...wts.map(x=>x.v))+0.5;const X=i=>pd+(W2-2*pd)*i/(wts.length-1),Y=v=>pd+(H2-2*pd)*(1-(v-mn)/(mx-mn));
        h+=`<div class="card chart"><svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="${t("weight")}"><polyline fill="none" stroke="var(--seal)" stroke-width="2.5" points="${wts.map((x,i)=>X(i)+","+Y(x.v)).join(" ")}"/>${wts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${i===wts.length-1?6:3.5}" fill="${i===wts.length-1?"var(--seal)":"var(--paper)"}" stroke="var(--seal)" stroke-width="2"/>`).join("")}</svg></div>`}}
    const recent=cis.slice(-7).map(x=>x[1]);const avg=k=>{const v=recent.map(r=>r[k]).filter(x=>x!=null&&x!=="");return v.length?v.reduce((a,b)=>a+ +b,0)/v.length:null};
    h+=`<div class="tablewrap"><table><thead><tr><th>${t("avg7")}</th><th class="r"></th></tr></thead><tbody>${[["sleepH"," h"],["sleepQ","/5"],["fatigue","/5"],["soreness","/5"]].map(([k,u])=>`<tr><td>${t(k)}</td><td class="r">${avg(k)==null?"–":fmtNum(avg(k))+u}</td></tr>`).join("")}</tbody></table></div>`;
  }
  h+=`</div>`;
  // adherence
  let c={done:0,partial:0,missed:0,none:0};const lim=ti.before?0:ti.raw;for(let n=0;n<Math.min(lim+1,189);n++){const w=Math.floor(n/7)+1,d=n%7;const s=logOf(idOf(w,d)).status;c[s||"none"]++}
  h+=`<div class="section"><h2>${serif(t("adherence"))}</h2><div class="tally num"><span class="st done">${t("done")} ${c.done}</span><span class="st partial">${t("partial")} ${c.partial}</span><span class="st missed">${t("missed")} ${c.missed}</span><span class="st">${t("notLogged")} ${c.none}</span></div></div>`;
  V.innerHTML=h;
}

function vTools(){
  const out=(id,lab)=>`<div class="lbl"><span>${lab}</span><output class="readout num" id="${id}" aria-live="polite"></output></div>`;
  V.innerHTML=`<div class="section"><h2>${serif(t("conv"))}</h2><div class="card"><div class="grid2"><label class="lbl">${t("pace")} (m:ss/km)<span class="field"><input id="tp" inputmode="numeric" data-time value="5:50"></span></label>${out("tpo","km/h")}</div></div></div>
  <div class="section"><h2>${serif(t("conv2"))}</h2><div class="card"><div class="grid2"><label class="lbl">km/h<span class="field"><input id="ts" inputmode="decimal" value="10.3"></span></label>${out("tso",t("pace")+" (/km)")}</div></div></div>
  <div class="section"><h2>${serif(t("calc"))}</h2><div class="card"><div class="grid2"><label class="lbl">${t("distance")}<span class="field"><input id="cd" inputmode="decimal" value="5"></span></label><label class="lbl">${t("time")}<span class="field"><input id="ct" inputmode="numeric" data-time value="27:00"></span></label>${out("co",t("pace")+" (/km)")}${out("co2","km/h")}</div></div></div>
  <div class="section"><h2>${serif(t("exp"))}</h2><p class="empty">${t("expNote")}</p><div><button class="btn" type="button" id="export" ${downloads?"":"hidden"}>${t("expBtn")}</button></div><p class="save" id="expmsg"></p></div>
  <div class="section"><h2>${serif(t("account"))}</h2><p class="empty">${t("restoreNote")}</p><div class="row2 acct"><button class="btn" type="button" id="backup">${t("backup")}</button><label class="linkbtn filebtn">${t("restore")}<input type="file" id="restore" accept="application/json,.json"></label><button class="linkbtn mute" type="button" id="signout">${t("signOut")}</button></div><p class="save" id="accmsg">${esc(S.accMsg||"")}</p></div>`;
  tools();
}
function tools(){
  const n=v=>parseFloat(String(v).replace(",","."));
  const p=secs(document.getElementById("tp").value);document.getElementById("tpo").textContent=p?fmtNum(3600/p,2):"–";
  const s=n(document.getElementById("ts").value);document.getElementById("tso").textContent=s>0?fmt(3600/s):"–";
  const d=n(document.getElementById("cd").value),tt=secs(document.getElementById("ct").value);document.getElementById("co").textContent=d>0&&tt?fmt(tt/d):"–";document.getElementById("co2").textContent=d>0&&tt?fmtNum(d/tt*3600,2):"–";
}

// ---------- events ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest(".nz"))return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(x){}render(true);return}
  if(b.dataset.tab){S.tab=b.dataset.tab;if(S.tab==="today"){const ti=todayIdx();S.sel={w:ti.w,d:ti.d}}render(true);window.scrollTo(0,0);return}
  if(b.dataset.nav){let n=(S.sel.w-1)*7+S.sel.d+Number(b.dataset.nav);n=Math.max(0,Math.min(188,n));S.sel={w:Math.floor(n/7)+1,d:n%7};render(true);return}
  if(b.dataset.wnav){S.selWeek=Math.max(1,Math.min(27,S.selWeek+Number(b.dataset.wnav)));render(true);return}
  if(b.dataset.open){const [w,d]=b.dataset.open.split(":").map(Number);S.sel={w,d};S.tab="today";render(true);window.scrollTo(0,0);return}
  if(b.dataset.week){S.selWeek=Number(b.dataset.week);S.tab="week";render(true);window.scrollTo(0,0);return}
  if(b.id==="export"){doExport();return}
  if(b.id==="backup"){doBackup();return}
  if(b.id==="signout"){P27.signOut();return}
  const {w,d}=S.sel||{};if(!S.sel)return;const id=idOf(w,d);
  if(b.dataset.ciScale){const k=ymd(dateOf(w,d)),c=ciEdit(k),v=+b.dataset.v;c[b.dataset.ciScale]=c[b.dataset.ciScale]===v?null:v;ciSave(k);render(true);return}
  if(b.dataset.rpe){const l=editable(id),v=+b.dataset.v;l.rpe=l.rpe===v?null:v;scheduleSave(id);render(true);return}
  if(b.dataset.status){const l=editable(id);l.status=l.status===b.dataset.status?null:b.dataset.status;scheduleSave(id);render(true);return}
  if(b.dataset.tick!==undefined){const i=b.dataset.tick,s=+b.dataset.s;const rows=liftRows(id,w,d,i);rows[s].done=!rows[s].done;scheduleSave(id);b.setAttribute("aria-pressed",rows[s].done);return}
  if(b.dataset.addset!==undefined){const rows=liftRows(id,w,d,b.dataset.addset);const last=rows[rows.length-1]||{kg:0,reps:0};rows.push({kg:last.kg,reps:last.reps,done:false});scheduleSave(id);render(true);return}
  if(b.dataset.rmset!==undefined){const rows=liftRows(id,w,d,b.dataset.rmset);if(rows.length>1)rows.pop();scheduleSave(id);render(true);return}
});
function liftRows(id,w,d,i){const l=editable(id);if(!l.lifts[i]){const it=dayData(w,d).items[+i];l.lifts[i]=expand(it).map(p=>({kg:p.kg,reps:p.reps,done:false}))}return l.lifts[i]}
document.addEventListener("input",e=>{
  const el=e.target;if(el.closest(".nz"))return;
  if(el.dataset.time!==undefined)el.value=maskTime(el.value);
  if(["tp","ts","cd","ct"].includes(el.id)){tools();return}
  if(!S.sel)return;const {w,d}=S.sel,id=idOf(w,d);
  const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
  if(el.dataset.ci){const k=ymd(dateOf(w,d)),c=ciEdit(k);c[el.dataset.ci]=num(el.value);ciSave(k);return}
  if(el.dataset.lift!==undefined){const rows=liftRows(id,w,d,el.dataset.lift);rows[+el.dataset.s][el.dataset.f]=num(el.value);scheduleSave(id);return}
  const l=editable(id);
  if(el.dataset.run){l.run=l.run||{};l.run[el.dataset.run]=el.dataset.run==="km"?num(el.value):el.value.trim();const p=l.run.km&&secs(l.run.time)?secs(l.run.time)/l.run.km:null;const pe=document.getElementById("pace");if(pe)pe.textContent=p?fmt(p)+"/km":"–";scheduleSave(id);return}
  if(el.dataset.test){l.test5k=el.value.trim();scheduleSave(id);return}
  if(el.dataset.station){l.stations=l.stations||{};l.stations[el.dataset.station]=el.value.trim();scheduleSave(id);return}
  if(el.dataset.notes){l.notes=el.value;scheduleSave(id);return}
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="restore"||!e.target.files[0])return;
  try{const dump=JSON.parse(await e.target.files[0].text());if(!dump||typeof dump!=="object"||!(dump.weeks||dump.logs||dump.plan))throw 0;
    const n=await db.importAll(dump);S.accMsg=n+" "+t("restored")}
  catch(x){S.accMsg=t("restoreFail")}
  const m=document.getElementById("accmsg");if(m)m.textContent=S.accMsg;
  e.target.value="";
});
document.addEventListener("focusout",()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&V.contains(a)&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))&&S.pending){S.pending=false;render()}},50)});

async function doExport(){
  const msg=document.getElementById("expmsg");
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["week","date","day","session","status","km_planned","km_done","time","pace","test_5k","lifts","stations","notes"].join(",")];
  for(let w=1;w<=27;w++){const wk=weekData(w);if(!wk)continue;wk.days.forEach((d,i)=>{const l=logOf(idOf(w,i));const r=l.run||{};const p=r.km&&secs(r.time)?fmt(secs(r.time)/r.km):"";
    const lifts=Object.entries(l.lifts||{}).map(([k,sets])=>{const it=d.items[+k];return(it&&it.name)+": "+sets.filter(s=>s.done).map(s=>s.kg+"x"+s.reps).join(" ")}).join(" | ");
    const st=Object.entries(l.stations||{}).filter(x=>x[1]).map(x=>x[0]+" "+x[1]).join(" | ");
    const dt=dateOf(w,i);lines.push([w,`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`,T.en.dl[i],q(d.session),l.status||"",d.km||0,r.km??"",r.time||"",p,l.test5k||"",q(lifts),q(st),q(l.notes)].join(","))})}
  try{const res=await downloads.save({filename:"hyrox-paris-2027-log.csv",data:"﻿"+lines.join("\n")});msg.textContent=res.status==="saved"?t("saved"):""}catch(e){msg.textContent=e&&e.code==="declined"?"":t("exportFail")}
}

async function doBackup(){
  const msg=document.getElementById("accmsg");
  try{const dump=await db.exportAll();const res=await downloads.save({filename:"paris27-sauvegarde-"+ymd(new Date())+".json",data:JSON.stringify(dump),type:"application/json"});msg.textContent=res.status==="saved"?t("saved"):""}
  catch(e){msg.textContent=t("exportFail")}
}
downloads={async save({filename,data,type}){
  const file=new File([data],filename,{type:type||"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")return{status:"declined"};}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:"saved"};
}};

// ---------- boot ----------
render(true);
(async()=>{
  if(!window.P27){S.dbFail=true;render(true);return}
  db=await P27.start(()=>render(true));
  render(true);
  const fail=e=>{if(e&&e.code!=="unavailable"){S.dbFail=true;render(true)}};
  db.doc("plan/meta").onSnapshot(s=>{S.meta=s.exists?s.data():null;S.ready.meta=true;later()},fail);
  db.collection("weeks").onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S.weeks=o;S.ready.weeks=true;later()},fail);
  db.collection("checkins").onSnapshot(s=>{s.docs.forEach(x=>{if(!ciDirty.has(x.id)&&!ciWriting[x.id])S.checkins[x.id]=JSON.parse(JSON.stringify(x.data()))});later()},fail);
  db.collection("reviews").onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S.reviews=o;later()},fail);
  if(window.P27N)P27N.attach({db,V,S,get lang(){return lang},t,esc,fmtNum,IC,parseISO,ymd,dayData,render,later});
  db.collection("logs").onSnapshot(s=>{s.docs.forEach(x=>{if(!dirty.has(x.id)&&!writing[x.id])S.logs[x.id]=JSON.parse(JSON.stringify(x.data()))});S.ready.logs=true;later()},fail);
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
function later(){const a=document.activeElement;if(a&&V.contains(a)&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")){S.pending=true;return}render()}
})();
</script>
